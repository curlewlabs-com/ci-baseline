name: CI

# Every pull request and push to main runs the action on this repository's own
# tree, on both architectures it installs tools for. The weekly run catches
# what changes outside this repository - the runner images, and the releases
# the pinned digests name - before a user does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "11 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # This repository's own Gemfile, which makes every run of the action over
  # this tree pull the Ruby image. A job that tests nothing in Ruby leaves it
  # out of the tracked files first, so it pulls nothing it does not need.
  RUBY_GEMFILE: lib/rubocop/Gemfile

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The type check, which needs this repository's own configuration. Its
    # Python is linted and formatted by the action itself, in `baseline`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned mypy
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  baseline:
    # The action as a consumer runs it, on this repository, which must pass.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./

  finds:
    # A script with no extension that shellcheck must still be given: the
    # discovery this repository owns, where the other checks are tested in
    # their own repositories.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add an extensionless script with an unquoted expansion
        run: |
          mkdir -p bin
          cat > bin/tool <<'SCRIPT'
          #!/bin/sh
          echo $1
          SCRIPT
          chmod +x bin/tool
          git add bin/tool
      - name: The action reports it
        id: judged
        continue-on-error: true
        uses: ./
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.judged.outcome }}
        run: test "$OUTCOME" = failure

  sources:
    # A script that sources a file beside it, in a directory below the
    # repository root: it passes only when shellcheck follows the source from
    # the script's own directory, and a mistake in the sourcing script still
    # fails once it does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a script that sources a sibling file
        run: |
          mkdir -p tools/greet
          cat > tools/greet/common.sh <<'SCRIPT'
          #!/bin/sh
          greet() {
          	echo "hello $1"
          }
          SCRIPT
          cat > tools/greet/caller.sh <<'SCRIPT'
          #!/bin/sh
          set -eu
          . ./common.sh
          greet "$@"
          SCRIPT
          git add tools/greet
      - name: The action passes it
        uses: ./
      - name: Add a mistake to the sourcing script
        run: |
          cat >> tools/greet/caller.sh <<'SCRIPT'
          greet $1
          SCRIPT
          git add tools/greet/caller.sh
      - name: The action reports it
        id: judged
        continue-on-error: true
        uses: ./
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.judged.outcome }}
        run: test "$OUTCOME" = failure

  python:
    # A Python script with no extension, which ruff must still be given: the
    # action passes it clean, and reports a lint finding in it and a
    # formatting difference in it, each on its own. The finding is one ruff
    # can fix, under a configuration that tells it to: the action must still
    # report it, and leave the file as it was.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a clean script with no extension
        run: |
          mkdir -p case
          cat > case/report <<'FILE'
          #!/usr/bin/env python3
          import sys

          print(sys.argv)
          FILE
          chmod +x case/report
          git add case
      - name: The action passes it
        uses: ./
      - name: Give it an import it does not use, and a configuration that fixes
        run: |
          cat > case/report <<'FILE'
          #!/usr/bin/env python3
          import os
          import sys

          print(sys.argv)
          FILE
          cat > case/ruff.toml <<'FILE'
          fix = true
          fix-only = true
          FILE
          git add case
      - name: The action reports it
        id: lint
        continue-on-error: true
        uses: ./
      - name: Require that the import is still there
        run: grep -qx 'import os' case/report
      - name: Format it badly instead
        run: |
          cat > case/report <<'FILE'
          #!/usr/bin/env python3
          import sys

          print( sys.argv )
          FILE
      - name: The action reports it
        id: format
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
        run: test "$LINT" = failure && test "$FORMAT" = failure

  silent:
    # A local action whose expressions sit where GitHub evaluates them passes;
    # the same action with one in an input's description, which GitHub
    # refuses to load, fails, and so does a workflow_run trigger naming no
    # workflow. zizmor refuses every workflow_run trigger too, so the last
    # case shows the action failing, not which of its checks failed; the
    # manifest case is one only the action's manifest lint reports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Add a local action with an expression in its input's default
        run: |
          mkdir -p case
          cat > case/action.yml <<'FILE'
          name: case
          description: Prints the token's length.
          inputs:
            token:
              description: The token to measure.
              default: @{{ github.token }}
          runs:
            using: composite
            steps:
              - shell: sh
                env:
                  TOKEN: @{{ inputs.token }}
                run: '"$GITHUB_ACTION_PATH/run.sh"'
          FILE
          cat > case/run.sh <<'FILE'
          #!/bin/sh
          set -eu
          echo "${#TOKEN}"
          FILE
          chmod +x case/run.sh
          # Written as @{{ and turned into an expression's opening here, so
          # this workflow evaluates none of the fixture's expressions itself.
          dollar='$'
          sed -i "s/@{{/${dollar}{{/g" case/action.yml
          git add case
      - name: The action passes it
        uses: ./
      - name: Describe the input with an expression instead
        run: |
          dollar='$'
          sed -i "s/description: The token to measure./description: The ${dollar}{{ github.token }} to measure./" case/action.yml
          grep -q 'description: The .{{ github.token }} to measure.' case/action.yml
      - name: The action reports it
        id: manifest
        continue-on-error: true
        uses: ./
      - name: Restore it, and add a workflow_run trigger naming no workflow
        run: |
          git restore case/action.yml
          cat > .github/workflows/case-child.yml <<'FILE'
          name: Case child
          on:
            workflow_run:
              workflows: [No Such Workflow]
              types: [completed]
          permissions: {}
          jobs:
            noop:
              runs-on: ubuntu-24.04
              steps:
                - run: "true"
          FILE
          git add .github/workflows/case-child.yml
      - name: The action reports it
        id: trigger
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          MANIFEST: ${{ steps.manifest.outcome }}
          TRIGGER: ${{ steps.trigger.outcome }}
        run: test "$MANIFEST" = failure && test "$TRIGGER" = failure

  shell:
    # A script whose EXIT trap fails a run that stopped short: the action
    # passes it, reports it once shfmt would rewrite it, and reports a trap
    # that lets such a run exit 0. That last report is made beside a file in
    # the checkout named for the lint's own module, which must not run in its
    # place.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a formatted script with a trap in the script form
        run: |
          mkdir -p case
          cat > case/work.sh <<'FILE'
          #!/bin/sh
          set -eu
          TMP=$(mktemp)
          RUN_COMPLETE=0
          # shellcheck disable=SC2154  # the trap body assigns _trap_rc before it reads it
          trap '_trap_rc=$?; [ "$RUN_COMPLETE" = 1 ] || [ "$_trap_rc" -ne 0 ] || _trap_rc=1; rm -f "$TMP"; exit "$_trap_rc"' EXIT
          if [ -n "$TMP" ]; then
          	echo working >"$TMP"
          fi
          RUN_COMPLETE=1
          FILE
          git add case
      - name: The action passes it
        uses: ./
      - name: Indent it with spaces
        run: |
          cat > case/work.sh <<'FILE'
          #!/bin/sh
          set -eu
          TMP=$(mktemp)
          RUN_COMPLETE=0
          # shellcheck disable=SC2154  # the trap body assigns _trap_rc before it reads it
          trap '_trap_rc=$?; [ "$RUN_COMPLETE" = 1 ] || [ "$_trap_rc" -ne 0 ] || _trap_rc=1; rm -f "$TMP"; exit "$_trap_rc"' EXIT
          if [ -n "$TMP" ]; then
              echo working >"$TMP"
          fi
          RUN_COMPLETE=1
          FILE
      - name: The action reports it
        id: format
        continue-on-error: true
        uses: ./
      - name: Give it a trap that only cleans up instead, and add a module named for the lint
        run: |
          cat > case/work.sh <<'FILE'
          #!/bin/sh
          set -eu
          TMP=$(mktemp)
          trap 'rm -f "$TMP"' EXIT
          echo working >"$TMP"
          FILE
          cat > shell_trap_lint.py <<'FILE'
          raise SystemExit(0)
          FILE
          git add shell_trap_lint.py
      - name: The action reports it
        id: trap
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          FORMAT: ${{ steps.format.outcome }}
          TRAP: ${{ steps.trap.outcome }}
        run: test "$FORMAT" = failure && test "$TRAP" = failure

  starlark:
    # A BUILD file and a .bzl file: the action passes them clean, and reports
    # a formatting difference in one and a lint warning in the other.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a formatted BUILD file and a .bzl file with no warning
        run: |
          mkdir -p case
          cat > case/BUILD.bazel <<'FILE'
          filegroup(
              name = "files",
              srcs = ["a.txt"],
          )
          FILE
          cat > case/defs.bzl <<'FILE'
          """A function that describes."""

          def describe():
              """Returns a description."""
              return "described"
          FILE
          git add case
      - name: The action passes them
        uses: ./
      - name: Put the BUILD file's rule on one line
        run: |
          cat > case/BUILD.bazel <<'FILE'
          filegroup(name = "files", srcs = ["a.txt"])
          FILE
      - name: The action reports it
        id: format
        continue-on-error: true
        uses: ./
      - name: Restore it, and give the function a variable it never reads
        run: |
          cat > case/BUILD.bazel <<'FILE'
          filegroup(
              name = "files",
              srcs = ["a.txt"],
          )
          FILE
          cat > case/defs.bzl <<'FILE'
          """A function that describes."""

          def describe():
              """Returns a description."""
              unused = 1
              return "described"
          FILE
      - name: The action reports it
        id: lint
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: test "$FORMAT" = failure && test "$LINT" = failure

  formats:
    # A tracked file prettier would format differently fails the run, and a
    # file the repository's .prettierignore names is left alone.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a JSON file prettier ignores, by name
        run: |
          printf '{"kept":   "as captured"}\n' > captured.json
          printf 'captured.json\n' > .prettierignore
          git add captured.json .prettierignore
      - name: The action passes it
        uses: ./
      - name: Add a JSON file prettier would reformat
        run: |
          printf '{"a":   1}\n' > unformatted.json
          git add unformatted.json
      - name: The action reports it
        id: judged
        continue-on-error: true
        uses: ./
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.judged.outcome }}
        run: test "$OUTCOME" = failure

  ruby:
    # A clean file of each form the action reads as Ruby passes, names that a
    # Ruby tool requires included. A Ruby script with no extension, given a
    # finding RuboCop could correct, is reported and left uncorrected, even
    # with RUBOCOP_OPTS asking for one other cop and for corrections. A
    # RuboCop options file at the root, tracked or not, and a configuration
    # file below it, each fail a tree that is otherwise clean. The fixture names are in
    # `env:`, since each names a file the case writes, not a run of the tool.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a clean file of each form
        run: |
          mkdir -p case/fastlane
          cat > case/greet <<'FILE'
          #!/usr/bin/env ruby
          # frozen_string_literal: true

          puts "hello"
          FILE
          chmod +x case/greet
          cp case/greet case/greet.tool
          printf '# frozen_string_literal: true\n\nbrew "jq"\n' >case/Brewfile.extra
          printf '# frozen_string_literal: true\n\napp_identifier "com.example.app"\n' >case/fastlane/Appfile
          printf '# frozen_string_literal: true\n\ngit_url "https://example.com/certificates"\n' >case/fastlane/Matchfile
          printf '# frozen_string_literal: true\n\ngem "fastlane-plugin-example"\n' >case/fastlane/Pluginfile
          printf '# frozen_string_literal: true\n\nputs "hello"\n' >case/greet.rb
          printf '# frozen_string_literal: true\n\ntask :default\n' >Rakefile.rb
          git add case Rakefile.rb
      - name: The action passes them
        uses: ./
      - name: Quote its string the other way
        run: |
          cat > case/greet <<'FILE'
          #!/usr/bin/env ruby
          # frozen_string_literal: true

          puts 'hello'
          FILE
      - name: The action reports it, whatever RUBOCOP_OPTS says
        id: finding
        continue-on-error: true
        env:
          RUBOCOP_OPTS: --only Layout/LineLength --autocorrect
        uses: ./
      - name: Require that the string is still as it was
        run: grep -qxF "puts 'hello'" case/greet
      - name: Restore it, and add an options file at the root
        env:
          OPTIONS_FILE: .rubocop
        run: |
          git restore case/greet
          printf -- '--only Layout/LineLength\n' >"$OPTIONS_FILE"
          git add "$OPTIONS_FILE"
      - name: The action reports it
        id: options
        continue-on-error: true
        uses: ./
      - name: Replace it with a configuration file below the root
        env:
          OPTIONS_FILE: .rubocop
          CONFIGURATION_FILE: case/.rubocop.yml
        run: |
          git rm -q -f "$OPTIONS_FILE"
          printf 'AllCops:\n  DisabledByDefault: true\n' >"$CONFIGURATION_FILE"
          git add "$CONFIGURATION_FILE"
      - name: The action reports it
        id: configuration
        continue-on-error: true
        uses: ./
      - name: Replace it with an options file at the root that is not tracked
        env:
          OPTIONS_FILE: .rubocop
          CONFIGURATION_FILE: case/.rubocop.yml
        run: |
          git rm -q -f "$CONFIGURATION_FILE"
          printf -- '--only Layout/LineLength\n' >"$OPTIONS_FILE"
      - name: The action reports it
        id: untracked
        continue-on-error: true
        uses: ./
      - name: Require that all four failed
        env:
          FINDING: ${{ steps.finding.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          CONFIGURATION: ${{ steps.configuration.outcome }}
          UNTRACKED: ${{ steps.untracked.outcome }}
        run: >-
          test "$FINDING" = failure && test "$OPTIONS" = failure &&
          test "$CONFIGURATION" = failure && test "$UNTRACKED" = failure

  ruby-forms:
    # Each form of Ruby file the action finds, alone in the tree with a
    # finding, fails the run: RuboCop is given every file the list holds,
    # whether or not its own file patterns would have picked the name.
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: case/greet.tool
            shebang: "#!/usr/bin/env ruby"
          - file: case/Brewfile.extra
            shebang: ""
          - file: case/fastlane/Appfile
            shebang: ""
          - file: case/fastlane/Matchfile
            shebang: ""
          - file: case/fastlane/Pluginfile
            shebang: ""
          - file: case/greet.rb
            shebang: ""
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add the file, with a string quoted the way the configuration refuses
        env:
          FILE: ${{ matrix.file }}
          SHEBANG: ${{ matrix.shebang }}
        run: |
          mkdir -p "$(dirname "$FILE")"
          {
            if [ -n "$SHEBANG" ]; then printf '%s\n' "$SHEBANG"; fi
            printf "# frozen_string_literal: true\n\nputs 'hello'\n"
          } >"$FILE"
          git add "$FILE"
      - name: The action reports it
        id: judged
        continue-on-error: true
        uses: ./
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.judged.outcome }}
        run: test "$OUTCOME" = failure

  ruby-skipped:
    # A tree that tracks no Ruby passes without the Ruby image being pulled at
    # all: the largest download the action makes is for the repositories that
    # need it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave this repository's own Gemfile out of the tracked files
        run: git rm -q --cached lib/rubocop/Gemfile
      - name: The action passes the tree
        uses: ./
      - name: Require that the image was not pulled from either registry
        run: |
          repositories=$(docker image ls --format '{{.Repository}}')
          if echo "$repositories" | grep -E '(^|/)ruby$'; then
            exit 1
          fi

  ruby-fallback:
    # ECR Public made unreachable - its name resolved to a closed local port -
    # and the image still arrives, from Docker Hub under the pinned digest,
    # after ECR Public's refusals are retried; RuboCop then passes a clean file.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point ECR Public at a closed port
        run: |
          echo "127.0.0.1 public.ecr.aws" | sudo tee -a /etc/hosts
          if curl -sS --max-time 10 -o /dev/null https://public.ecr.aws/v2/; then
            echo "public.ecr.aws is still reachable" >&2
            exit 1
          fi
      - name: Pull the image
        id: pull
        run: |
          lib/install-tools.sh ruby 2>"$RUNNER_TEMP/pull.log" >"$RUNNER_TEMP/pulled" || {
            cat "$RUNNER_TEMP/pull.log"
            exit 1
          }
          cat "$RUNNER_TEMP/pull.log"
          echo "reference=$(cat "$RUNNER_TEMP/pulled")" >>"$GITHUB_OUTPUT"
      - name: Require the fallback, after retries, to have pulled the pinned digest
        env:
          REFERENCE: ${{ steps.pull.outputs.reference }}
        run: |
          pinned=$(sed -n 's/^RUBY_VERSION=.*@//p' lib/install-tools.sh)
          case "$REFERENCE" in docker.io/library/ruby:*"@$pinned") ;; *)
            echo "pulled $REFERENCE, not Docker Hub's $pinned" >&2
            exit 1
            ;;
          esac
          images=$(docker image ls --digests --format '{{.Repository}} {{.Digest}}')
          echo "$images"
          echo "$images" | grep -Ex "(docker\.io/library/)?ruby $pinned"
          if echo "$images" | grep -F public.ecr.aws; then
            exit 1
          fi
          # ECR Public's two retries; Docker Hub may retry too, and still pass.
          test "$(grep -c '^ci-baseline: public\.ecr\.aws/.* failed (attempt' "$RUNNER_TEMP/pull.log")" -eq 2
      - name: Add a clean Ruby file
        run: |
          mkdir -p case
          printf '# frozen_string_literal: true\n\nputs "hello"\n' >case/greet.rb
          git add case
      - name: The action passes it with the image from Docker Hub
        uses: ./

  ruby-isolated:
    # What a caller's job or checkout could set for Ruby, Bundler or RuboCop is
    # planted - RUBOCOP_OPTS and Bundler settings in the job's environment, a
    # .bundle/config, a Gemfile and a .ruby-version in the checkout - and none
    # of it reaches the container: a clean tree still passes, a finding
    # RUBOCOP_OPTS would hide still fails, and a lock entry whose checksum is
    # wrong still fails although the planted settings switch checksums off.
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_OPTS: --only Layout/LineLength
      BUNDLE_DISABLE_CHECKSUM_VALIDATION: "true"
      BUNDLE_FROZEN: "false"
      BUNDLE_GEMFILE: Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plant a .bundle/config, a Gemfile and a .ruby-version, and add a clean script
        run: |
          mkdir -p .bundle case
          printf -- '---\nBUNDLE_DISABLE_CHECKSUM_VALIDATION: "true"\nBUNDLE_FROZEN: "false"\n' >.bundle/config
          printf '# frozen_string_literal: true\n\nsource "https://rubygems.org"\n' >Gemfile
          echo 2.7.8 >.ruby-version
          printf '# frozen_string_literal: true\n\nputs "hello"\n' >case/greet.rb
          git add case .bundle Gemfile .ruby-version
      - name: The action passes it
        uses: ./
      - name: Quote its string the other way
        run: |
          cat > case/greet.rb <<'FILE'
          # frozen_string_literal: true

          puts 'hello'
          FILE
      - name: The action reports it
        id: finding
        continue-on-error: true
        uses: ./
      - name: Restore it, and give one gem in the lock a checksum that is not its own
        run: |
          git restore case/greet.rb
          sed -i "s/^\(  rainbow (.*) sha256=\).*/\1$(printf '0%.0s' $(seq 64))/" lib/rubocop/Gemfile.lock
          grep -q "^  rainbow (.*) sha256=0000" lib/rubocop/Gemfile.lock
      - name: The action refuses it
        id: checksum
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          FINDING: ${{ steps.finding.outcome }}
          CHECKSUM: ${{ steps.checksum.outcome }}
        run: test "$FINDING" = failure && test "$CHECKSUM" = failure

  conclusion:
    # The one check branch protection requires, so adding or renaming a job
    # above needs no settings change - only this list.
    needs:
      - lint
      - baseline
      - finds
      - sources
      - python
      - silent
      - shell
      - starlark
      - formats
      - ruby
      - ruby-forms
      - ruby-skipped
      - ruby-isolated
      - ruby-fallback
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          LINT: ${{ needs.lint.result }}
          BASELINE: ${{ needs.baseline.result }}
          FINDS: ${{ needs.finds.result }}
          SOURCES: ${{ needs.sources.result }}
          PYTHON: ${{ needs.python.result }}
          SILENT: ${{ needs.silent.result }}
          SHELL_FILES: ${{ needs.shell.result }}
          STARLARK: ${{ needs.starlark.result }}
          FORMATS: ${{ needs.formats.result }}
          RUBY: ${{ needs.ruby.result }}
          RUBY_FORMS: ${{ needs.ruby-forms.result }}
          RUBY_SKIPPED: ${{ needs.ruby-skipped.result }}
          RUBY_ISOLATED: ${{ needs.ruby-isolated.result }}
          RUBY_FALLBACK: ${{ needs.ruby-fallback.result }}
        run: >-
          test "$LINT" = success && test "$BASELINE" = success &&
          test "$FINDS" = success && test "$SOURCES" = success &&
          test "$PYTHON" = success && test "$SILENT" = success &&
          test "$SHELL_FILES" = success &&
          test "$STARLARK" = success && test "$FORMATS" = success &&
          test "$RUBY" = success && test "$RUBY_FORMS" = success &&
          test "$RUBY_SKIPPED" = success && test "$RUBY_ISOLATED" = success &&
          test "$RUBY_FALLBACK" = success
