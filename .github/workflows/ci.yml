name: CI

# Every pull request and push to main runs the action on this repository's own
# tree, on both architectures it installs tools for. The weekly run catches
# what changes outside this repository - the runner images, and the releases
# the pinned digests name - before a user does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "11 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # This repository's own Gemfile, which makes every run of the action over
  # this tree pull the Ruby image. A job that tests nothing in Ruby leaves it
  # out of the tracked files first, so it pulls nothing it does not need.
  RUBY_GEMFILE: lib/rubocop/Gemfile

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The type check, which needs this repository's own configuration. Its
    # Python is linted and formatted by the action itself, in `baseline`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned mypy
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  test:
    # The unit tests of tools/, which need only the standard library. The
    # action's own checks are tested by the case jobs below, each against a
    # fixture tree.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Unit tests
        run: python -m unittest discover -s tools

  test-pyright:
    # The pyright step's own unit tests, on the python3 the runner image ships,
    # which is the one the step runs on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

  baseline:
    # The action as a consumer runs it, on this repository, which must pass.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./

  finds:
    # A script with no extension that shellcheck must still be given: the
    # discovery this repository owns, where the other checks are tested in
    # their own repositories.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add an extensionless script with an unquoted expansion
        run: |
          mkdir -p bin
          cat > bin/tool <<'SCRIPT'
          #!/bin/sh
          echo $1
          SCRIPT
          chmod +x bin/tool
          git add bin/tool
      - name: The action reports it
        id: judged
        continue-on-error: true
        uses: ./
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.judged.outcome }}
        run: test "$OUTCOME" = failure

  sources:
    # A script that sources a file beside it, in a directory below the
    # repository root: it passes only when shellcheck follows the source from
    # the script's own directory, and a mistake in the sourcing script still
    # fails once it does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a script that sources a sibling file
        run: |
          mkdir -p tools/greet
          cat > tools/greet/common.sh <<'SCRIPT'
          #!/bin/sh
          greet() {
          	echo "hello $1"
          }
          SCRIPT
          cat > tools/greet/caller.sh <<'SCRIPT'
          #!/bin/sh
          set -eu
          . ./common.sh
          greet "$@"
          SCRIPT
          git add tools/greet
      - name: The action passes it
        uses: ./
      - name: Add a mistake to the sourcing script
        run: |
          cat >> tools/greet/caller.sh <<'SCRIPT'
          greet $1
          SCRIPT
          git add tools/greet/caller.sh
      - name: The action reports it
        id: judged
        continue-on-error: true
        uses: ./
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.judged.outcome }}
        run: test "$OUTCOME" = failure

  python:
    # A Python script with no extension, which ruff must still be given: the
    # action passes it clean, and reports a lint finding in it and a
    # formatting difference in it, each on its own. The finding is one ruff
    # can fix, under a configuration that tells it to: the action must still
    # report it, and leave the file as it was.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a clean script with no extension
        run: |
          mkdir -p case
          cat > case/report <<'FILE'
          #!/usr/bin/env python3
          import sys

          print(sys.argv)
          FILE
          chmod +x case/report
          git add case
      - name: The action passes it
        uses: ./
      - name: Give it an import it does not use, and a configuration that fixes
        run: |
          cat > case/report <<'FILE'
          #!/usr/bin/env python3
          import os
          import sys

          print(sys.argv)
          FILE
          cat > case/ruff.toml <<'FILE'
          fix = true
          fix-only = true
          FILE
          git add case
      - name: The action reports it
        id: lint
        continue-on-error: true
        uses: ./
      - name: Require that the import is still there
        run: grep -qx 'import os' case/report
      - name: Format it badly instead
        run: |
          cat > case/report <<'FILE'
          #!/usr/bin/env python3
          import sys

          print( sys.argv )
          FILE
      - name: The action reports it
        id: format
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
        run: test "$LINT" = failure && test "$FORMAT" = failure

  # The type check's proof cases. A fixture text that names the type checker,
  # its configuration or a lint the action runs is put in `env:` rather than
  # written into a `run:`, since it names what the case writes, not a run of
  # the tool.
  pyright:
    # The policy: a clean tree passes, with a comparison only the rule this
    # action switches off everywhere would report, and with typed files under
    # a directory beginning with `.` and one named node_modules, which pyright
    # leaves unread by default and the action must not; a strict finding fails in
    # a file that is not a test and in a test; and a mypy suppression does
    # not hide a finding on its line.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Add typed modules, one with a comparison of a set with a frozenset
        run: |
          mkdir -p case
          cat > case/clean.py <<'FILE'
          FROZEN = frozenset({"a"})


          def same(items: set[str]) -> bool:
              return items == FROZEN
          FILE
          mkdir -p case/.hooks case/node_modules
          printf 'LABEL: str = "label"\n' >case/.hooks/label.py
          printf 'LABEL: str = "label"\n' >case/node_modules/label.py
          git add case
      - name: The action passes it
        uses: ./
      - name: Add a function whose parameter has no type
        run: |
          cat > case/double.py <<'FILE'
          def double(value):
              return value * 2
          FILE
          git add case
      - name: The action reports it
        id: code
        continue-on-error: true
        uses: ./
      - name: Move it into a test
        run: git mv case/double.py case/test_double.py
      - name: The action reports it
        id: test
        continue-on-error: true
        uses: ./
      - name: Replace it with an assignment of the wrong type, under a mypy suppression
        run: |
          git rm -q -f case/test_double.py
          printf 'LABEL: int = "label"  # type: ignore[assignment]\n' >case/label.py
          git add case/label.py
      - name: The action reports it
        id: suppressed
        continue-on-error: true
        uses: ./
      - name: Require that all three failed
        env:
          CODE: ${{ steps.code.outcome }}
          TEST: ${{ steps.test.outcome }}
          SUPPRESSED: ${{ steps.suppressed.outcome }}
        run: >-
          test "$CODE" = failure && test "$TEST" = failure &&
          test "$SUPPRESSED" = failure

  pyright-tests:
    # The two rules the policy switches off in tests only, each shown both
    # ways: a test calling a module's private helper, and a test handing a
    # lambda to a parameter typed Any, pass; the same file outside a test
    # fails.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Add a module, a test that calls its private helper, and one that hands it a lambda
        run: |
          mkdir -p case
          cat > case/clean.py <<'FILE'
          from typing import Any


          def _helper(value: int) -> int:
              return value + 1


          def run(callback: Any) -> None:
              callback(_helper(1))
          FILE
          printf 'import clean\n\nprint(clean._helper(1))\n' >case/test_private.py
          printf 'import clean\n\nclean.run(lambda value: value)\n' >case/test_callback.py
          git add case
      - name: The action passes them
        uses: ./
      - name: Make the private call outside a test
        run: git mv case/test_private.py case/private.py
      - name: The action reports it
        id: private
        continue-on-error: true
        uses: ./
      - name: Make the lambda outside a test instead
        run: |
          git mv case/private.py case/test_private.py
          git mv case/test_callback.py case/callback.py
      - name: The action reports it
        id: lambda
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          PRIVATE: ${{ steps.private.outcome }}
          LAMBDA: ${{ steps.lambda.outcome }}
        run: test "$PRIVATE" = failure && test "$LAMBDA" = failure

  pyright-comments:
    # The one comment a file may carry silences the rule it names on its line
    # and no other. An ignore naming no rule, a comment lowering the whole
    # file to basic and one switching a rule off for the whole file are each
    # refused, over a finding each would otherwise have hidden.
    runs-on: ubuntu-24.04
    env:
      NAMED: "# pyright: ignore[reportAssignmentType]"
      OTHER: "# pyright: ignore[reportUnknownMemberType]"
      BLANKET: "# pyright: ignore"
      BASIC: "# pyright: basic"
      RULE_OFF: "# pyright: reportAssignmentType=false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Add an assignment of the wrong type, silenced by name
        run: |
          mkdir -p case
          printf 'LABEL: int = "label"  %s\n' "$NAMED" >case/label.py
          git add case
      - name: The action passes it
        uses: ./
      - name: Name another rule instead
        run: |
          printf 'LABEL: int = "label"  %s\n' "$OTHER" >case/label.py
      - name: The action reports it
        id: other
        continue-on-error: true
        uses: ./
      - name: Name no rule instead
        run: |
          printf 'LABEL: int = "label"  %s\n' "$BLANKET" >case/label.py
      - name: The action reports it
        id: blanket
        continue-on-error: true
        uses: ./
      - name: Lower the whole file to basic instead, over a finding only strict makes
        run: |
          printf '%s\nLABEL: str = "label"\n\n\ndef double(value):\n    return value * 2\n' "$BASIC" >case/label.py
      - name: The action reports it
        id: basic
        continue-on-error: true
        uses: ./
      - name: Switch the rule off for the whole file instead
        run: |
          printf '%s\nLABEL: int = "label"\n' "$RULE_OFF" >case/label.py
      - name: The action reports it
        id: rule-off
        continue-on-error: true
        uses: ./
      - name: Require that all four failed
        env:
          OTHER_RULE: ${{ steps.other.outcome }}
          BLANKET_IGNORE: ${{ steps.blanket.outcome }}
          BASIC_FILE: ${{ steps.basic.outcome }}
          RULE_OFF_FILE: ${{ steps.rule-off.outcome }}
        run: >-
          test "$OTHER_RULE" = failure && test "$BLANKET_IGNORE" = failure &&
          test "$BASIC_FILE" = failure && test "$RULE_OFF_FILE" = failure

  pyright-configuration:
    # A configuration in the checkout that is not tracked is never read: with
    # one at the root and one beside the file, each switching checking off, a
    # clean tree passes and a finding still fails. A tracked one, and a
    # tracked pyproject.toml table, each fail a tree that is otherwise clean.
    runs-on: ubuntu-24.04
    env:
      CONFIGURATION: pyrightconfig.json
      TABLE: "[tool.pyright]"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Add a typed module, and an untracked configuration that switches checking off
        run: |
          mkdir -p case
          printf 'LABEL: str = "label"\n' >case/label.py
          git add case
          printf '{ "typeCheckingMode": "off" }\n' >"$CONFIGURATION"
          printf '{ "typeCheckingMode": "off" }\n' >"case/$CONFIGURATION"
      - name: The action passes it
        uses: ./
      - name: Give it an assignment of the wrong type
        run: |
          printf 'LABEL: int = "label"\n' >case/label.py
      - name: The action reports it
        id: untracked
        continue-on-error: true
        uses: ./
      - name: Fix it, and track the configuration beside it
        run: |
          printf 'LABEL: str = "label"\n' >case/label.py
          git add "case/$CONFIGURATION"
      - name: The action refuses it
        id: tracked
        continue-on-error: true
        uses: ./
      - name: Replace it with a table in the tracked pyproject.toml
        run: |
          git rm -q --cached "case/$CONFIGURATION"
          printf '\n%s\ntypeCheckingMode = "off"\n' "$TABLE" >>pyproject.toml
      - name: The action refuses it
        id: table
        continue-on-error: true
        uses: ./
      - name: Require that all three failed
        env:
          UNTRACKED: ${{ steps.untracked.outcome }}
          TRACKED: ${{ steps.tracked.outcome }}
          TABLE_OUTCOME: ${{ steps.table.outcome }}
        run: >-
          test "$UNTRACKED" = failure && test "$TRACKED" = failure &&
          test "$TABLE_OUTCOME" = failure

  pyright-floor:
    # The Python checked against is ruff's target-version, read from each of
    # the files ruff reads it from: a module importing a name the standard
    # library added in 3.13 fails at this repository's own 3.12, and passes
    # once that file names 3.13.
    strategy:
      fail-fast: false
      matrix:
        file: [.ruff.toml, ruff.toml, pyproject.toml]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Add a module that imports a name from 3.13
        run: |
          mkdir -p case
          cat > case/narrow.py <<'FILE'
          from typing import TypeIs


          def is_text(value: object) -> TypeIs[str]:
              return isinstance(value, str)
          FILE
          git add case
      - name: The action reports it
        id: floor
        continue-on-error: true
        uses: ./
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.floor.outcome }}
        run: test "$OUTCOME" = failure
      - name: Raise the floor to 3.13 in the file
        env:
          FILE: ${{ matrix.file }}
        run: |
          if [ "$FILE" = pyproject.toml ]; then
            sed -i 's/^target-version = "py312"$/target-version = "py313"/' "$FILE"
            grep -qx 'target-version = "py313"' "$FILE"
          else
            printf 'target-version = "py313"\n' >"$FILE"
          fi
      - name: The action passes it
        uses: ./

  pyright-stated:
    # The platform checked for is mypy's: an error only reachable on macOS
    # passes, and fails once pyproject.toml names darwin. A repository whose
    # ruff configuration names no target-version fails, since its floor is
    # unstated; ruff itself then takes the floor from `requires-python`, so
    # it is not what fails.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Add an error only reachable on macOS
        run: |
          mkdir -p case
          cat > case/platform.py <<'FILE'
          import sys

          if sys.platform == "darwin":
              LABEL: int = "darwin"
          FILE
          git add case
      - name: The action passes it
        uses: ./
      - name: Name darwin as mypy's platform
        run: |
          sed -i 's/^\[tool\.mypy\]$/&\nplatform = "darwin"/' pyproject.toml
          grep -qx 'platform = "darwin"' pyproject.toml
      - name: The action reports it
        id: platform
        continue-on-error: true
        uses: ./
      - name: Restore it, and take the target-version out
        run: |
          git restore pyproject.toml
          git rm -q --cached case/platform.py
          sed -i '/^target-version = /d' pyproject.toml
          ! grep -q '^target-version' pyproject.toml
      - name: The action reports it
        id: unstated
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          PLATFORM: ${{ steps.platform.outcome }}
          UNSTATED: ${{ steps.unstated.outcome }}
        run: test "$PLATFORM" = failure && test "$UNSTATED" = failure

  pyright-resolution:
    # Where a file's imports resolve. Two directories each hold a `helper`,
    # one whose VALUE is a str and one whose VALUE is an int, so a module
    # that reads VALUE as a str passes only if its import resolved to the
    # helper in its own directory: beside the str one it passes, beside the
    # int one it fails. A namespace package under src/ resolves from a test
    # elsewhere in the tree. An import that resolved nowhere would fail
    # every case.
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: own-directory
            main: case/b/main.py
            expect: success
          - case: own-directory-differs
            main: case/a/main.py
            expect: failure
          - case: namespace-package
            expect: success
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Write the case
        env:
          CASE: ${{ matrix.case }}
          MAIN: ${{ matrix.main }}
        run: |
          mkdir -p case
          case $CASE in
          namespace-package)
            mkdir -p case/src/space case/tests
            printf 'VALUE: str = "label"\n' >case/src/space/helper.py
            printf 'from space import helper\n\nLABEL: str = helper.VALUE\n' >case/tests/check_space.py
            ;;
          *)
            mkdir -p case/a case/b
            printf 'VALUE: int = 1\n' >case/a/helper.py
            printf 'VALUE: str = "label"\n' >case/b/helper.py
            printf 'import helper\n\nLABEL: str = helper.VALUE\n' >"$MAIN"
            ;;
          esac
          git add case
      - name: The action judges it
        id: judged
        continue-on-error: true
        uses: ./
      - name: Require the expected outcome
        env:
          OUTCOME: ${{ steps.judged.outcome }}
          EXPECT: ${{ matrix.expect }}
        run: test "$OUTCOME" = "$EXPECT"

  pyright-search-paths:
    # An import of a module the repository does not track resolves only
    # through `python-search-paths`, relative or absolute, and nothing in a
    # search path is checked: its module has a finding of its own. That
    # module takes the name the tracked file reads from a sibling in its own
    # directory, so each pass needs the sibling to resolve: were it not, the
    # name would be unknown and the tracked file would fail. An untracked
    # module in the checkout is not read without it, and a search path that
    # does not exist fails.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Add a module that imports one fetched into the checkout and outside it, which imports its sibling
        env:
          OUTSIDE: ${{ runner.temp }}/fetched
        run: |
          mkdir -p case vendor "$OUTSIDE"
          printf 'import vendored\n\nLABEL: str = vendored.LABEL\n' >case/uses.py
          git add case
          printf 'from vendored_label import LABEL\n\n\ndef double(value):\n    return value * 2\n' >vendor/vendored.py
          printf 'LABEL: str = "label"\n' >vendor/vendored_label.py
          cp vendor/vendored.py vendor/vendored_label.py "$OUTSIDE/"
      - name: The action reports it
        id: unnamed
        continue-on-error: true
        uses: ./
      - name: The action passes it, given the directory in the checkout
        uses: ./
        with:
          python-search-paths: vendor
      - name: The action passes it, given the directory outside the checkout
        uses: ./
        with:
          python-search-paths: |
            ${{ runner.temp }}/fetched
      - name: The action reports a directory that does not exist
        id: missing
        continue-on-error: true
        uses: ./
        with:
          python-search-paths: |
            vendor
            fetched
      - name: Require that both failed
        env:
          UNNAMED: ${{ steps.unnamed.outcome }}
          MISSING: ${{ steps.missing.outcome }}
        run: test "$UNNAMED" = failure && test "$MISSING" = failure

  pyright-isolated:
    # What a caller's job or checkout could set for the type checker, or for
    # the node and Python it is run by, is planted, and none of it reaches the
    # check. Each judged run below fails, where any one of its plants alone
    # would have let it pass.
    #
    # First, a finding, under: NODE_OPTIONS loading a script that answers the
    # checker's request for a report with a clean one; PYTHONPATH naming a
    # json module that exits 0; a stand-in checker on PATH, and one in the
    # checkout's node_modules, that each report nothing. Then a tracked import
    # of a typed package the repository does not track, which resolves if the
    # checker reads the job's Python (PYTHONPATH names a directory holding
    # it) or anything untracked in the checkout (the module beside the
    # tracked file, a stub under typings/). A clean tree under every plant at
    # once passes.
    runs-on: ubuntu-24.04
    env:
      CHECKER: pyright
      CLEAN_REPORT: --require ${{ github.workspace }}/planted/clean-report.js
      STAND_INS: ${{ github.workspace }}/planted/stand-ins
      MODULES: ${{ github.workspace }}/planted/modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Plant the stand-ins, and add a typed module
        run: |
          mkdir -p planted/bin "$STAND_INS" "$MODULES/planted" case typings "node_modules/$CHECKER" node_modules/.bin
          cat > planted/clean-report.js <<'FILE'
          if (process.argv.includes("--outputjson")) {
            const files = process.argv.filter((arg) => arg.endsWith(".py")).length;
            process.stdout.write(
              JSON.stringify({ generalDiagnostics: [], summary: { filesAnalyzed: files } }),
            );
            process.exit(0);
          }
          FILE
          cp planted/clean-report.js "node_modules/$CHECKER/index.js"
          printf '#!/bin/sh\necho "0 errors"\n' >"planted/bin/$CHECKER"
          cp "planted/bin/$CHECKER" "node_modules/.bin/$CHECKER"
          chmod +x "planted/bin/$CHECKER" "node_modules/.bin/$CHECKER"
          echo "$PWD/planted/bin" >>"$GITHUB_PATH"
          printf 'raise SystemExit(0)\n' >"$STAND_INS/json.py"
          printf 'LABEL: str = "label"\n' >"$MODULES/planted/__init__.py"
          touch "$MODULES/planted/py.typed"
          printf 'LABEL: str = "label"\n' >case/planted.py
          printf 'LABEL: str\n' >typings/planted.pyi
          printf 'LABEL: str = "label"\n' >case/label.py
          git add case/label.py
      - name: The action passes it, under every plant
        env:
          NODE_OPTIONS: ${{ env.CLEAN_REPORT }}
          PYTHONPATH: ${{ env.STAND_INS }}:${{ env.MODULES }}
        uses: ./
      - name: Give it an assignment of the wrong type
        run: |
          printf 'LABEL: int = "label"\n' >case/label.py
      - name: The action reports it, under the planted report, json and checkers
        id: environment
        continue-on-error: true
        env:
          NODE_OPTIONS: ${{ env.CLEAN_REPORT }}
          PYTHONPATH: ${{ env.STAND_INS }}
        uses: ./
      - name: Fix it, and import the planted package instead
        run: |
          printf 'LABEL: str = "label"\n' >case/label.py
          printf 'import planted\n\nLABEL: str = planted.LABEL\n' >case/uses.py
          git add case/uses.py
      - name: The action reports it, with the package on PYTHONPATH and in the checkout
        id: module
        continue-on-error: true
        env:
          PYTHONPATH: ${{ env.MODULES }}
        uses: ./
      - name: Require that both failed
        env:
          ENVIRONMENT: ${{ steps.environment.outcome }}
          MODULE: ${{ steps.module.outcome }}
        run: test "$ENVIRONMENT" = failure && test "$MODULE" = failure

  pyright-skipped:
    # A tree that tracks no Python file pyright can be given passes without
    # the type checker being run, though the files are still there,
    # untracked.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Leave every .py file out of the tracked files
        run: git ls-files -z -- '*.py' '*.pyi' | xargs -0 git rm -q --cached --
      - name: The action passes the tree
        uses: ./
      - name: Require that the type checker was not run
        env:
          WORK: ${{ runner.temp }}/ci-baseline/pyright
        run: test ! -e "$WORK"
  silent:
    # A local action whose expressions sit where GitHub evaluates them passes;
    # the same action with one in an input's description, which GitHub
    # refuses to load, fails, and so does a workflow_run trigger naming no
    # workflow. zizmor refuses every workflow_run trigger too, so the last
    # case shows the action failing, not which of its checks failed; the
    # manifest case is one only the action's manifest lint reports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave the Gemfile out of the tracked files
        run: git rm -q --cached "$RUBY_GEMFILE"
      - name: Add a local action with an expression in its input's default
        run: |
          mkdir -p case
          cat > case/action.yml <<'FILE'
          name: case
          description: Prints the token's length.
          inputs:
            token:
              description: The token to measure.
              default: @{{ github.token }}
          runs:
            using: composite
            steps:
              - shell: sh
                env:
                  TOKEN: @{{ inputs.token }}
                run: '"$GITHUB_ACTION_PATH/run.sh"'
          FILE
          cat > case/run.sh <<'FILE'
          #!/bin/sh
          set -eu
          echo "${#TOKEN}"
          FILE
          chmod +x case/run.sh
          # Written as @{{ and turned into an expression's opening here, so
          # this workflow evaluates none of the fixture's expressions itself.
          dollar='$'
          sed -i "s/@{{/${dollar}{{/g" case/action.yml
          git add case
      - name: The action passes it
        uses: ./
      - name: Describe the input with an expression instead
        run: |
          dollar='$'
          sed -i "s/description: The token to measure./description: The ${dollar}{{ github.token }} to measure./" case/action.yml
          grep -q 'description: The .{{ github.token }} to measure.' case/action.yml
      - name: The action reports it
        id: manifest
        continue-on-error: true
        uses: ./
      - name: Restore it, and add a workflow_run trigger naming no workflow
        run: |
          git restore case/action.yml
          cat > .github/workflows/case-child.yml <<'FILE'
          name: Case child
          on:
            workflow_run:
              workflows: [No Such Workflow]
              types: [completed]
          permissions: {}
          jobs:
            noop:
              runs-on: ubuntu-24.04
              steps:
                - run: "true"
          FILE
          git add .github/workflows/case-child.yml
      - name: The action reports it
        id: trigger
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          MANIFEST: ${{ steps.manifest.outcome }}
          TRIGGER: ${{ steps.trigger.outcome }}
        run: test "$MANIFEST" = failure && test "$TRIGGER" = failure

  shell:
    # A script whose EXIT trap fails a run that stopped short: the action
    # passes it, reports it once shfmt would rewrite it, and reports a trap
    # that lets such a run exit 0. That last report is made beside a file in
    # the checkout named for the lint's own module, which must not run in its
    # place.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a formatted script with a trap in the script form
        run: |
          mkdir -p case
          cat > case/work.sh <<'FILE'
          #!/bin/sh
          set -eu
          TMP=$(mktemp)
          RUN_COMPLETE=0
          # shellcheck disable=SC2154  # the trap body assigns _trap_rc before it reads it
          trap '_trap_rc=$?; [ "$RUN_COMPLETE" = 1 ] || [ "$_trap_rc" -ne 0 ] || _trap_rc=1; rm -f "$TMP"; exit "$_trap_rc"' EXIT
          if [ -n "$TMP" ]; then
          	echo working >"$TMP"
          fi
          RUN_COMPLETE=1
          FILE
          git add case
      - name: The action passes it
        uses: ./
      - name: Indent it with spaces
        run: |
          cat > case/work.sh <<'FILE'
          #!/bin/sh
          set -eu
          TMP=$(mktemp)
          RUN_COMPLETE=0
          # shellcheck disable=SC2154  # the trap body assigns _trap_rc before it reads it
          trap '_trap_rc=$?; [ "$RUN_COMPLETE" = 1 ] || [ "$_trap_rc" -ne 0 ] || _trap_rc=1; rm -f "$TMP"; exit "$_trap_rc"' EXIT
          if [ -n "$TMP" ]; then
              echo working >"$TMP"
          fi
          RUN_COMPLETE=1
          FILE
      - name: The action reports it
        id: format
        continue-on-error: true
        uses: ./
      - name: Give it a trap that only cleans up instead, and add a module named for the lint
        run: |
          cat > case/work.sh <<'FILE'
          #!/bin/sh
          set -eu
          TMP=$(mktemp)
          trap 'rm -f "$TMP"' EXIT
          echo working >"$TMP"
          FILE
          cat > shell_trap_lint.py <<'FILE'
          raise SystemExit(0)
          FILE
          git add shell_trap_lint.py
      - name: The action reports it
        id: trap
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          FORMAT: ${{ steps.format.outcome }}
          TRAP: ${{ steps.trap.outcome }}
        run: test "$FORMAT" = failure && test "$TRAP" = failure

  starlark:
    # A BUILD file and a .bzl file: the action passes them clean, and reports
    # a formatting difference in one and a lint warning in the other.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a formatted BUILD file and a .bzl file with no warning
        run: |
          mkdir -p case
          cat > case/BUILD.bazel <<'FILE'
          filegroup(
              name = "files",
              srcs = ["a.txt"],
          )
          FILE
          cat > case/defs.bzl <<'FILE'
          """A function that describes."""

          def describe():
              """Returns a description."""
              return "described"
          FILE
          git add case
      - name: The action passes them
        uses: ./
      - name: Put the BUILD file's rule on one line
        run: |
          cat > case/BUILD.bazel <<'FILE'
          filegroup(name = "files", srcs = ["a.txt"])
          FILE
      - name: The action reports it
        id: format
        continue-on-error: true
        uses: ./
      - name: Restore it, and give the function a variable it never reads
        run: |
          cat > case/BUILD.bazel <<'FILE'
          filegroup(
              name = "files",
              srcs = ["a.txt"],
          )
          FILE
          cat > case/defs.bzl <<'FILE'
          """A function that describes."""

          def describe():
              """Returns a description."""
              unused = 1
              return "described"
          FILE
      - name: The action reports it
        id: lint
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: test "$FORMAT" = failure && test "$LINT" = failure

  formats:
    # A tracked file prettier would format differently fails the run, and a
    # file the repository's .prettierignore names is left alone.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a JSON file prettier ignores, by name
        run: |
          printf '{"kept":   "as captured"}\n' > captured.json
          printf 'captured.json\n' > .prettierignore
          git add captured.json .prettierignore
      - name: The action passes it
        uses: ./
      - name: Add a JSON file prettier would reformat
        run: |
          printf '{"a":   1}\n' > unformatted.json
          git add unformatted.json
      - name: The action reports it
        id: judged
        continue-on-error: true
        uses: ./
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.judged.outcome }}
        run: test "$OUTCOME" = failure

  ruby:
    # A clean file of each form the action reads as Ruby passes, names that a
    # Ruby tool requires included. A Ruby script with no extension, given a
    # finding RuboCop could correct, is reported and left uncorrected, even
    # with RUBOCOP_OPTS asking for one other cop and for corrections. A
    # RuboCop options file at the root, tracked or not, and a configuration
    # file below it, each fail a tree that is otherwise clean. The fixture names are in
    # `env:`, since each names a file the case writes, not a run of the tool.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a clean file of each form
        run: |
          mkdir -p case/fastlane
          cat > case/greet <<'FILE'
          #!/usr/bin/env ruby
          # frozen_string_literal: true

          puts "hello"
          FILE
          chmod +x case/greet
          cp case/greet case/greet.tool
          printf '# frozen_string_literal: true\n\nbrew "jq"\n' >case/Brewfile.extra
          printf '# frozen_string_literal: true\n\napp_identifier "com.example.app"\n' >case/fastlane/Appfile
          printf '# frozen_string_literal: true\n\ngit_url "https://example.com/certificates"\n' >case/fastlane/Matchfile
          printf '# frozen_string_literal: true\n\ngem "fastlane-plugin-example"\n' >case/fastlane/Pluginfile
          printf '# frozen_string_literal: true\n\nputs "hello"\n' >case/greet.rb
          printf '# frozen_string_literal: true\n\ntask :default\n' >Rakefile.rb
          git add case Rakefile.rb
      - name: The action passes them
        uses: ./
      - name: Quote its string the other way
        run: |
          cat > case/greet <<'FILE'
          #!/usr/bin/env ruby
          # frozen_string_literal: true

          puts 'hello'
          FILE
      - name: The action reports it, whatever RUBOCOP_OPTS says
        id: finding
        continue-on-error: true
        env:
          RUBOCOP_OPTS: --only Layout/LineLength --autocorrect
        uses: ./
      - name: Require that the string is still as it was
        run: grep -qxF "puts 'hello'" case/greet
      - name: Restore it, and add an options file at the root
        env:
          OPTIONS_FILE: .rubocop
        run: |
          git restore case/greet
          printf -- '--only Layout/LineLength\n' >"$OPTIONS_FILE"
          git add "$OPTIONS_FILE"
      - name: The action reports it
        id: options
        continue-on-error: true
        uses: ./
      - name: Replace it with a configuration file below the root
        env:
          OPTIONS_FILE: .rubocop
          CONFIGURATION_FILE: case/.rubocop.yml
        run: |
          git rm -q -f "$OPTIONS_FILE"
          printf 'AllCops:\n  DisabledByDefault: true\n' >"$CONFIGURATION_FILE"
          git add "$CONFIGURATION_FILE"
      - name: The action reports it
        id: configuration
        continue-on-error: true
        uses: ./
      - name: Replace it with an options file at the root that is not tracked
        env:
          OPTIONS_FILE: .rubocop
          CONFIGURATION_FILE: case/.rubocop.yml
        run: |
          git rm -q -f "$CONFIGURATION_FILE"
          printf -- '--only Layout/LineLength\n' >"$OPTIONS_FILE"
      - name: The action reports it
        id: untracked
        continue-on-error: true
        uses: ./
      - name: Require that all four failed
        env:
          FINDING: ${{ steps.finding.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          CONFIGURATION: ${{ steps.configuration.outcome }}
          UNTRACKED: ${{ steps.untracked.outcome }}
        run: >-
          test "$FINDING" = failure && test "$OPTIONS" = failure &&
          test "$CONFIGURATION" = failure && test "$UNTRACKED" = failure

  ruby-forms:
    # Each form of Ruby file the action finds, alone in the tree with a
    # finding, fails the run: RuboCop is given every file the list holds,
    # whether or not its own file patterns would have picked the name.
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: case/greet.tool
            shebang: "#!/usr/bin/env ruby"
          - file: case/Brewfile.extra
            shebang: ""
          - file: case/fastlane/Appfile
            shebang: ""
          - file: case/fastlane/Matchfile
            shebang: ""
          - file: case/fastlane/Pluginfile
            shebang: ""
          - file: case/greet.rb
            shebang: ""
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add the file, with a string quoted the way the configuration refuses
        env:
          FILE: ${{ matrix.file }}
          SHEBANG: ${{ matrix.shebang }}
        run: |
          mkdir -p "$(dirname "$FILE")"
          {
            if [ -n "$SHEBANG" ]; then printf '%s\n' "$SHEBANG"; fi
            printf "# frozen_string_literal: true\n\nputs 'hello'\n"
          } >"$FILE"
          git add "$FILE"
      - name: The action reports it
        id: judged
        continue-on-error: true
        uses: ./
      - name: Require that it failed
        env:
          OUTCOME: ${{ steps.judged.outcome }}
        run: test "$OUTCOME" = failure

  ruby-skipped:
    # A tree that tracks no Ruby passes without the Ruby image being pulled at
    # all: the largest download the action makes is for the repositories that
    # need it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leave this repository's own Gemfile out of the tracked files
        run: git rm -q --cached lib/rubocop/Gemfile
      - name: The action passes the tree
        uses: ./
      - name: Require that the image was not pulled from either registry
        run: |
          repositories=$(docker image ls --format '{{.Repository}}')
          if echo "$repositories" | grep -E '(^|/)ruby$'; then
            exit 1
          fi

  ruby-fallback:
    # ECR Public made unreachable - its name resolved to a closed local port -
    # and the image still arrives, from Docker Hub under the pinned digest,
    # after ECR Public's refusals are retried; RuboCop then passes a clean file.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Point ECR Public at a closed port
        run: |
          echo "127.0.0.1 public.ecr.aws" | sudo tee -a /etc/hosts
          if curl -sS --max-time 10 -o /dev/null https://public.ecr.aws/v2/; then
            echo "public.ecr.aws is still reachable" >&2
            exit 1
          fi
      - name: Pull the image
        id: pull
        run: |
          lib/install-tools.sh ruby 2>"$RUNNER_TEMP/pull.log" >"$RUNNER_TEMP/pulled" || {
            cat "$RUNNER_TEMP/pull.log"
            exit 1
          }
          cat "$RUNNER_TEMP/pull.log"
          echo "reference=$(cat "$RUNNER_TEMP/pulled")" >>"$GITHUB_OUTPUT"
      - name: Require the fallback, after retries, to have pulled the pinned digest
        env:
          REFERENCE: ${{ steps.pull.outputs.reference }}
        run: |
          pinned=$(sed -n 's/^RUBY_VERSION=.*@//p' lib/install-tools.sh)
          case "$REFERENCE" in docker.io/library/ruby:*"@$pinned") ;; *)
            echo "pulled $REFERENCE, not Docker Hub's $pinned" >&2
            exit 1
            ;;
          esac
          images=$(docker image ls --digests --format '{{.Repository}} {{.Digest}}')
          echo "$images"
          echo "$images" | grep -Ex "(docker\.io/library/)?ruby $pinned"
          if echo "$images" | grep -F public.ecr.aws; then
            exit 1
          fi
          # ECR Public's two retries; Docker Hub may retry too, and still pass.
          test "$(grep -c '^ci-baseline: public\.ecr\.aws/.* failed (attempt' "$RUNNER_TEMP/pull.log")" -eq 2
      - name: Add a clean Ruby file
        run: |
          mkdir -p case
          printf '# frozen_string_literal: true\n\nputs "hello"\n' >case/greet.rb
          git add case
      - name: The action passes it with the image from Docker Hub
        uses: ./

  ruby-isolated:
    # What a caller's job or checkout could set for Ruby, Bundler or RuboCop is
    # planted - RUBOCOP_OPTS and Bundler settings in the job's environment, a
    # .bundle/config, a Gemfile and a .ruby-version in the checkout - and none
    # of it reaches the container: a clean tree still passes, a finding
    # RUBOCOP_OPTS would hide still fails, and a lock entry whose checksum is
    # wrong still fails although the planted settings switch checksums off.
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_OPTS: --only Layout/LineLength
      BUNDLE_DISABLE_CHECKSUM_VALIDATION: "true"
      BUNDLE_FROZEN: "false"
      BUNDLE_GEMFILE: Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plant a .bundle/config, a Gemfile and a .ruby-version, and add a clean script
        run: |
          mkdir -p .bundle case
          printf -- '---\nBUNDLE_DISABLE_CHECKSUM_VALIDATION: "true"\nBUNDLE_FROZEN: "false"\n' >.bundle/config
          printf '# frozen_string_literal: true\n\nsource "https://rubygems.org"\n' >Gemfile
          echo 2.7.8 >.ruby-version
          printf '# frozen_string_literal: true\n\nputs "hello"\n' >case/greet.rb
          git add case .bundle Gemfile .ruby-version
      - name: The action passes it
        uses: ./
      - name: Quote its string the other way
        run: |
          cat > case/greet.rb <<'FILE'
          # frozen_string_literal: true

          puts 'hello'
          FILE
      - name: The action reports it
        id: finding
        continue-on-error: true
        uses: ./
      - name: Restore it, and give one gem in the lock a checksum that is not its own
        run: |
          git restore case/greet.rb
          sed -i "s/^\(  rainbow (.*) sha256=\).*/\1$(printf '0%.0s' $(seq 64))/" lib/rubocop/Gemfile.lock
          grep -q "^  rainbow (.*) sha256=0000" lib/rubocop/Gemfile.lock
      - name: The action refuses it
        id: checksum
        continue-on-error: true
        uses: ./
      - name: Require that both failed
        env:
          FINDING: ${{ steps.finding.outcome }}
          CHECKSUM: ${{ steps.checksum.outcome }}
        run: test "$FINDING" = failure && test "$CHECKSUM" = failure

  eslint:
    # The action's eslint step as a consumer runs it: it passes clean
    # JavaScript and TypeScript, and fails a finding on the rule that reports
    # it. What eslint does with each kind of input is the cases job's.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add clean JavaScript and TypeScript
        run: |
          mkdir -p case
          printf 'export const total = (values) => values.reduce((a, b) => a + b, 0);\n' > case/clean.mjs
          printf 'export function first(values: readonly string[]): string | undefined {\n  return values[0];\n}\n' > case/clean.ts
          git add case
      - name: The action passes them
        uses: ./
      - name: Read a name nothing defines
        run: |
          printf 'export const value = undefinedName;\n' > case/finding.mjs
          git add case/finding.mjs
      - name: The action reports it
        id: finding
        continue-on-error: true
        uses: ./
      - name: Require that it failed on that rule
        env:
          OUTCOME: ${{ steps.finding.outcome }}
          REPORT: ${{ runner.temp }}/ci-baseline/lint/eslint.out
        run: test "$OUTCOME" = failure && grep -q 'no-undef' "$REPORT"

  typed:
    # The typed entry point as a consumer runs it: in a TypeScript package it
    # passes a promise that is awaited, and fails one left floating on the rule
    # that reports it, which only type information can tell apart, so the
    # baseline layer passes both.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add a package whose promise is awaited
        run: |
          mkdir -p case/src
          printf '{\n  "compilerOptions": {\n    "strict": true,\n    "noEmit": true,\n    "target": "es2022",\n    "module": "es2022",\n    "lib": ["es2022"]\n  },\n  "include": ["src"]\n}\n' > case/tsconfig.json
          printf 'async function settle(): Promise<void> {}\nexport async function run(): Promise<void> {\n  await settle();\n}\n' > case/src/main.ts
          git add case
      - name: The typed entry point passes it
        uses: ./typed
      - name: Leave the promise floating
        run: |
          printf 'async function settle(): Promise<void> {}\nexport function run(): void {\n  settle();\n}\n' > case/src/main.ts
          git add case
      - name: The typed entry point reports it
        id: floating
        continue-on-error: true
        uses: ./typed
      - name: Require that it failed on that rule
        env:
          OUTCOME: ${{ steps.floating.outcome }}
          REPORT: ${{ runner.temp }}/ci-baseline/lint/eslint.out
        run: test "$OUTCOME" = failure && grep -q '@typescript-eslint/no-floating-promises' "$REPORT"
      - name: The baseline layer passes it
        uses: ./

  eslint-cases:
    # tests/eslint_cases.py: each exemption the configuration makes, as a case
    # it allows and the nearest case it must still report; every way a
    # checkout or a job could change what eslint checks; and the toolchain
    # install's refusals. A case that must fail names the rule or the refusal
    # it fails on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain
        env:
          DEST: ${{ runner.temp }}/cases-lint
        run: lib/install-lint.sh "$DEST"
      - name: Install the node:test declarations the typed cases read
        env:
          TYPES: ${{ runner.temp }}/cases-node-types
        run: |
          mkdir -p "$TYPES"
          cp tests/node-types/package.json tests/node-types/package-lock.json "$TYPES/"
          cd "$TYPES"
          npm ci --ignore-scripts --registry=https://registry.npmjs.org/ --audit=false --fund=false
      - name: Run the cases
        env:
          DEST: ${{ runner.temp }}/cases-lint
          TYPES: ${{ runner.temp }}/cases-node-types
        run: python3 -I tests/eslint_cases.py "$DEST" "$TYPES"

  rules:
    # lint/rules.txt is every rule the configuration turns on, for each kind of
    # file and layer, so a toolchain bump or an edit that changes what is
    # checked shows up as a diff of that file.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain
        env:
          DEST: ${{ runner.temp }}/rules-lint
        run: lib/install-lint.sh "$DEST"
      - name: Require that the resolved rules are rules.txt
        env:
          DEST: ${{ runner.temp }}/rules-lint
        run: node "$DEST/print-rules.mjs" | diff -u lint/rules.txt -

  config-tarball:
    # The configuration tarball a release attaches is packed as the release
    # packs it, and holds the licence files, byte for byte the root's.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack it and read it back
        run: python3 -I tests/config_tarball.py

  conclusion:
    # The one check branch protection requires, so adding or renaming a job
    # above needs no settings change - only this list.
    needs:
      - lint
      - test
      - test-pyright
      - baseline
      - finds
      - sources
      - python
      - pyright
      - pyright-tests
      - pyright-comments
      - pyright-configuration
      - pyright-floor
      - pyright-stated
      - pyright-resolution
      - pyright-search-paths
      - pyright-isolated
      - pyright-skipped
      - silent
      - shell
      - starlark
      - formats
      - ruby
      - ruby-forms
      - ruby-skipped
      - ruby-isolated
      - ruby-fallback
      - eslint
      - typed
      - eslint-cases
      - rules
      - config-tarball
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          TEST_PYRIGHT: ${{ needs.test-pyright.result }}
          BASELINE: ${{ needs.baseline.result }}
          FINDS: ${{ needs.finds.result }}
          SOURCES: ${{ needs.sources.result }}
          PYTHON: ${{ needs.python.result }}
          PYRIGHT: ${{ needs.pyright.result }}
          PYRIGHT_TESTS: ${{ needs.pyright-tests.result }}
          PYRIGHT_COMMENTS: ${{ needs.pyright-comments.result }}
          PYRIGHT_CONFIGURATION: ${{ needs.pyright-configuration.result }}
          PYRIGHT_FLOOR: ${{ needs.pyright-floor.result }}
          PYRIGHT_STATED: ${{ needs.pyright-stated.result }}
          PYRIGHT_RESOLUTION: ${{ needs.pyright-resolution.result }}
          PYRIGHT_SEARCH_PATHS: ${{ needs.pyright-search-paths.result }}
          PYRIGHT_ISOLATED: ${{ needs.pyright-isolated.result }}
          PYRIGHT_SKIPPED: ${{ needs.pyright-skipped.result }}
          SILENT: ${{ needs.silent.result }}
          SHELL_FILES: ${{ needs.shell.result }}
          STARLARK: ${{ needs.starlark.result }}
          FORMATS: ${{ needs.formats.result }}
          RUBY: ${{ needs.ruby.result }}
          RUBY_FORMS: ${{ needs.ruby-forms.result }}
          RUBY_SKIPPED: ${{ needs.ruby-skipped.result }}
          RUBY_ISOLATED: ${{ needs.ruby-isolated.result }}
          RUBY_FALLBACK: ${{ needs.ruby-fallback.result }}
          ESLINT: ${{ needs.eslint.result }}
          TYPED: ${{ needs.typed.result }}
          ESLINT_CASES: ${{ needs.eslint-cases.result }}
          RULES: ${{ needs.rules.result }}
          CONFIG_TARBALL: ${{ needs.config-tarball.result }}
        run: >-
          test "$LINT" = success && test "$TEST" = success &&
          test "$TEST_PYRIGHT" = success &&
          test "$BASELINE" = success &&
          test "$FINDS" = success && test "$SOURCES" = success &&
          test "$PYTHON" = success && test "$SILENT" = success &&
          test "$PYRIGHT" = success && test "$PYRIGHT_TESTS" = success &&
          test "$PYRIGHT_COMMENTS" = success &&
          test "$PYRIGHT_CONFIGURATION" = success &&
          test "$PYRIGHT_FLOOR" = success && test "$PYRIGHT_STATED" = success &&
          test "$PYRIGHT_RESOLUTION" = success &&
          test "$PYRIGHT_SEARCH_PATHS" = success &&
          test "$PYRIGHT_ISOLATED" = success &&
          test "$PYRIGHT_SKIPPED" = success && test "$SHELL_FILES" = success &&
          test "$STARLARK" = success && test "$FORMATS" = success &&
          test "$RUBY" = success && test "$RUBY_FORMS" = success &&
          test "$RUBY_SKIPPED" = success && test "$RUBY_ISOLATED" = success &&
          test "$RUBY_FALLBACK" = success &&
          test "$ESLINT" = success && test "$TYPED" = success &&
          test "$ESLINT_CASES" = success && test "$RULES" = success &&
          test "$CONFIG_TARBALL" = success
