# Not a package: the configuration of the lint the action runs over this
# repository's Python, and of the type check CI runs over tools/.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tools", "lib", "tests"]
