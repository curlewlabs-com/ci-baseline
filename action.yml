name: ci-baseline
description: >-
  The checks every repository runs: actionlint, zizmor, shellcheck, shfmt and
  shell-trap-lint over every shell file, ruff, RuboCop, buildifier, prettier
  formatting, ASCII-only text, GitHub-hosted runners only, and composite steps
  that call scripts.
author: Curlew Labs
branding:
  icon: check-square
  color: gray-dark

# Each check runs whatever the one before it found, so one run reports all of
# them; any failure still fails the action.
runs:
  using: composite
  steps:
    - name: ascii-lint
      uses: curlewlabs-com/ascii-lint@3d1e5eebd3b957020b46882d3b9a6d1bd212046b # v0.2.0
    - name: hosted-runner-lint
      if: ${{ !cancelled() }}
      uses: curlewlabs-com/hosted-runner-lint@81695b70a6a7715c5c8951aed9f9abd7d97ab9a0 # v0.1.0
    - name: action-run-lint
      if: ${{ !cancelled() }}
      uses: curlewlabs-com/action-run-lint@09a094e71cff461987330467a871ad6d1026df4c # v0.1.0
    - name: Install the pinned tools
      id: tools
      if: ${{ !cancelled() }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/install-tools.sh"'
    - name: actionlint
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/actionlint.sh"'
    - name: zizmor
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$GITHUB_ACTION_PATH/lib/zizmor.sh"'
    - name: List the tracked files
      id: files
      if: ${{ !cancelled() }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/tracked-files.sh"'
    - name: shellcheck
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/shellcheck.sh"'
    - name: shfmt
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/shfmt.sh"'
    - name: shell-trap-lint
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/shell-trap-lint.sh"'
    - name: ruff
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/ruff.sh"'
    # Runs in its own Ruby container, and only where Ruby is tracked, so it
    # needs the file list and not the tools step.
    - name: rubocop
      if: ${{ !cancelled() && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/rubocop.sh"'
    - name: buildifier
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/buildifier.sh"'
    - name: prettier
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/prettier.sh"'
