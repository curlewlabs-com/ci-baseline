name: ci-baseline
description: >-
  The checks every repository runs: actionlint, zizmor, shellcheck over every
  shell file, ASCII-only text, GitHub-hosted runners only, and composite steps
  that call scripts.
author: Curlew Labs
branding:
  icon: check-square
  color: gray-dark

# Each check runs whatever the one before it found, so one run reports all of
# them; any failure still fails the action.
runs:
  using: composite
  steps:
    - name: ascii-lint
      uses: curlewlabs-com/ascii-lint@903ae0510aae5655a6e2194ae99ed772d91a601c # v0.1.0
    - name: hosted-runner-lint
      if: ${{ !cancelled() }}
      uses: curlewlabs-com/hosted-runner-lint@81695b70a6a7715c5c8951aed9f9abd7d97ab9a0 # v0.1.0
    - name: action-run-lint
      if: ${{ !cancelled() }}
      uses: curlewlabs-com/action-run-lint@09a094e71cff461987330467a871ad6d1026df4c # v0.1.0
    - name: Install the pinned actionlint, shellcheck and zizmor
      id: tools
      if: ${{ !cancelled() }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/install-tools.sh"'
    - name: actionlint
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/actionlint.sh"'
    - name: zizmor
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$GITHUB_ACTION_PATH/lib/zizmor.sh"'
    - name: shellcheck every shell file
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/shellcheck.sh"'
