name: ci-baseline
description: >-
  The checks every repository runs: actionlint, zizmor, shellcheck, shfmt and
  shell-trap-lint over every shell file, ruff and pyright strict, RuboCop,
  buildifier, prettier formatting, eslint's rules that need no type
  information, ASCII-only text, GitHub-hosted runners only, composite steps
  that call scripts, and workflow_run triggers and action manifests GitHub
  accepts on push and then never runs.
author: Curlew Labs
branding:
  icon: check-square
  color: gray-dark

inputs:
  python-search-paths:
    description: >-
      Directories, one per line, absolute or relative to the repository root,
      that the repository's Python imports from and does not track: a
      dependency an earlier step of the same job fetched or installed. pyright
      resolves imports through them and checks nothing in them.
    required: false
    default: ""

# Each check runs whatever the one before it found, so one run reports all of
# them; any failure still fails the action.
runs:
  using: composite
  steps:
    - name: ascii-lint
      uses: curlewlabs-com/ascii-lint@07e845d6570ba5060adb12d0e8fcf76ba7fbd225 # v0.2.2
    - name: hosted-runner-lint
      if: ${{ !cancelled() }}
      uses: curlewlabs-com/hosted-runner-lint@120108691a9b7a32ab0c78cb6d019620edfe1dab # v0.1.2
    - name: action-run-lint
      if: ${{ !cancelled() }}
      uses: curlewlabs-com/action-run-lint@84ba9cf857120d55d2a1d9bdaf480b8f7d251c2d # v0.1.2
    - name: actions-silent-lint
      if: ${{ !cancelled() }}
      uses: curlewlabs-com/actions-silent-lint@ccdba5f8fecaa5b95bb2223598a406a9a727a42c # v0.2.1
    - name: Install the pinned tools
      id: tools
      if: ${{ !cancelled() }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/install-tools.sh"'
    - name: actionlint
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/actionlint.sh"'
    - name: zizmor
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      shell: sh
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$GITHUB_ACTION_PATH/lib/zizmor.sh"'
    - name: List the tracked files
      id: files
      if: ${{ !cancelled() }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/tracked-files.sh"'
    - name: shellcheck
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/shellcheck.sh"'
    - name: shfmt
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/shfmt.sh"'
    - name: shell-trap-lint
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/shell-trap-lint.sh"'
    - name: ruff
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/ruff.sh"'
    - name: pyright
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      env:
        CI_BASELINE_SEARCH_PATHS: ${{ inputs.python-search-paths }}
      run: '"$GITHUB_ACTION_PATH/lib/pyright.sh"'
    # Runs in its own Ruby container, and only where Ruby is tracked, so it
    # needs the file list and not the tools step.
    - name: rubocop
      if: ${{ !cancelled() && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/rubocop.sh"'
    - name: buildifier
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/buildifier.sh"'
    - name: prettier
      if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/prettier.sh"'
    - name: Install the eslint toolchain
      id: lint
      if: ${{ !cancelled() && steps.files.outcome == 'success' }}
      shell: sh
      run: '"$GITHUB_ACTION_PATH/lib/install-lint.sh"'
    - name: eslint
      if: ${{ !cancelled() && steps.files.outcome == 'success' && steps.lint.outcome == 'success' }}
      shell: sh
      env:
        LAYER: baseline
      run: '"$GITHUB_ACTION_PATH/lib/eslint.sh"'
